[project]
name = "cmus-auto-lyrics"
version = "0.4.0"
description = "Curses based lyrics display and fetcher for cmus music player with auto scroll and tag support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azlyrics>=1.3.2",
    "lyricsgenius>=3.12.2",
    "pytaglib>=3.2.0",
]

[dependency-groups]
build = [
    "nuitka[onefile]>=4.1.3",
    "pyinstaller>=6.22.1",
]
